<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Eldoria Migration Bridge</title>
</head>
<body>
  <script>
    // Listen for requests from the parent window
    window.addEventListener('message', function(event) {
      // Allow messages from eldoriaidle.site (and local dev)
      var origin = event.origin || '';
      if (
        origin.indexOf('eldoriaidle.site') !== -1 ||
        origin.indexOf('localhost') !== -1 ||
        origin.indexOf('127.0.0.1') !== -1
      ) {
        if (event.data && event.data.type === 'GET_ELDORIA_LEGACY_AUTH') {
          var guestId = localStorage.getItem('eldoria_guest_id');
          var token = localStorage.getItem('eldoria_session_token');

          event.source.postMessage({
            type: 'ELDORIA_LEGACY_AUTH_RESULT',
            guestId: guestId,
            token: token
          }, event.origin);
        }
      }
    });
  </script>
</body>
</html>
